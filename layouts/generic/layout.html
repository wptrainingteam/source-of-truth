<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- sot:head -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sot.css">
<script>try{var t=localStorage.getItem('sot:theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
<a class="sot-skip" href="#content">Skip to content</a>
<div class="sot-progress" aria-hidden="true"><span></span></div>

<!-- sot:header -->

<div class="sot-wrap sot-layout" id="top">
<button class="sot-rail-handle" type="button" data-sot-rail-toggle aria-controls="toc" aria-expanded="true" aria-label="Collapse contents" title="Collapse contents  [">
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
</button>
  <nav class="sot-toc" id="toc" data-sot-toc aria-label="Contents" tabindex="-1">
    <button class="sot-btn sot-btn--ghost sot-btn--icon sot-toc__close" type="button" data-sot-toc-close aria-label="Close contents"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="sot-toc__top">
      <button class="sot-find-btn" type="button" data-sot-find aria-haspopup="dialog">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg>
      <span>Find</span><kbd data-sot-kbd>⌘K</kbd>
      </button>
    </div>
    <div class="sot-toc__head"><p class="sot-toc__title">Contents</p><span class="sot-toc__count"></span></div>
    <div class="sot-toc__meter" aria-hidden="true"><span></span></div>
    <div class="sot-toc__aud" data-sot-aud-picker></div>
<!-- sot:toc -->
    <div class="sot-toc__tools">
      <button class="sot-btn sot-btn--ghost" type="button" data-sot-random>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Jump to a random item
      </button>
      <button class="sot-btn sot-btn--ghost sot-btn--quiet" type="button" data-sot-reset-read>Clear reading progress</button>
    </div>
  </nav>

  <div class="sot-main">
<div class="sot-start" id="start" aria-label="Start here">
<div class="sot-start__hero">
<!-- sot:hero -->
<!-- sot:stats -->
</div>
<!-- sot:timeline -->
<div class="sot-intro">
<!-- sot:changelog -->
<!-- sot:resources -->
  <section class="sot-audience" id="audience" data-sot-start="Who are you reading as?" aria-labelledby="audience-title">
    <h2 id="audience-title" class="sot-audience__title">Who are you reading as?</h2>
    <p class="sot-audience__intro">Pick one or more. Everything else folds down to its title.</p>
<!-- sot:filter -->
    <p class="sot-audience__status" data-sot-aud-status aria-live="polite"></p>
  </section>
</div>
</div>

  <main class="sot-content" id="content">
<!-- sot:sections -->
<!-- sot:punted -->
  </main>
  </div>
</div>

<footer class="sot-footer">
  <div class="sot-wrap">
    <span class="sot-footer__poetry">Code is poetry.</span>
    <span>Source of Truth · <a href="#top">Back to top</a></span>
  </div>
</footer>
<button class="sot-to-top" type="button" aria-label="Back to top"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<script src="site.js"></script>
</body>
</html>
