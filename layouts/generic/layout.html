<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- sot:head -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F2; --card:#FFFFFF; --soft:#FAF9F6; --sand:#ECEAE3; --line:#DCDAD2; --line-2:#CFCCC2;
  --ink:#1E1E1E; --ink-2:#3D3D39; --muted:#5A5A55; --faint:#8C8A82;
  --accent:#3858E9; --accent-ink:#1D35B4; --accent-soft:#EEF1FD; --accent-light:#9DB0FF;
  --highlight:#FFE27A;
  --dark:#1E1E1E; --dark-2:#2A2A27; --dark-line:#3A3A37; --on-dark:#F2F1EC; --on-dark-2:#BDBBB3;
  --serif:'EB Garamond', Georgia, serif; --sans:Inter, system-ui, -apple-system, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
  --radius:16px; --gutter:clamp(16px, 4vw, 24px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:clamp(16px, 1.1vw + 12px, 17px);line-height:1.65;overflow-x:hidden}
img,svg{max-width:100%}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
code{font-family:var(--mono);font-size:.86em;background:var(--sand);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--mono);font-size:13px;background:#fff;border:1px solid var(--line-2);border-bottom-width:3px;border-radius:6px;padding:2px 8px;color:var(--ink);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-inline:var(--gutter)}
.eyebrow{margin:0 0 12px;font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--accent)}
.tags{margin:0 0 12px;font-family:var(--mono);font-size:13px;color:var(--accent);overflow-wrap:anywhere}
.h2{margin:0 0 16px;font-family:var(--serif);font-weight:500;font-size:clamp(34px, 4.2vw, 48px);line-height:1.05;letter-spacing:-.01em}
.small{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px, 3vw, 28px)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* Pills */
.pill{min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line-2);transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}

/* Reading progress */
.progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;background:transparent}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:rgba(247,246,242,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:0 6px;height:40px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--serif);font-size:22px;font-weight:600}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-text b{font-size:15px}
.brand-text span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.version-switch{flex:none;min-width:0;max-width:60%}
.version-switch select{min-height:44px;max-width:100%;padding:0 12px;border-radius:999px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.version-list{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;padding:0;list-style:none;font-size:13px}
@media (max-width: 520px){.brand-text span{display:none}}

/* Hero */
.hero{padding-block:clamp(40px, 7vw, 72px) clamp(32px, 5vw, 56px)}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(44px, 7vw, 92px);line-height:.98;letter-spacing:-.02em;overflow-wrap:break-word}
.hero .intro{margin:24px 0 0;font-size:clamp(18px, 1.6vw, 20px);line-height:1.55;color:var(--ink-2);max-width:720px}
.hero .more{margin-top:16px;color:var(--ink-2)}
.byline{margin:20px 0 0;font-size:14px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:clamp(40px, 6vw, 64px)}
.stat{background:var(--paper);padding:24px}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(36px, 4vw, 44px);line-height:1}
.stat span{display:block;font-size:14px;color:var(--muted);margin-top:8px}

/* Timeline */
.timeline{background:var(--dark);color:var(--on-dark)}
.timeline .wrap{padding-block:clamp(40px, 6vw, 56px)}
.timeline-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:28px}
.timeline h2{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(32px, 4vw, 40px);line-height:1.1}
.milestones{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 160px), 1fr));gap:8px;margin:0;padding:0;list-style:none}
.ms{min-height:92px;padding:14px;border-radius:12px;background:var(--dark-2);color:#fff}
.ms small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--on-dark-2)}
.ms b{display:block;font-size:16px;margin-top:4px}

/* Audience filter */
.aud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:24px;margin-block:clamp(32px, 5vw, 48px) 24px}
.aud h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2}
.aud p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.aud p b{color:var(--ink)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;padding-bottom:96px}
@media (min-width: 1024px){.layout{grid-template-columns:240px minmax(0,1fr);gap:56px}}
.toc{align-self:start}
@media (min-width: 1024px){.toc{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto}}
.toc details{border:1px solid var(--line);border-radius:12px;background:#fff}
.toc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"+";font-size:18px;color:var(--ink)}
.toc details[open] summary::after{content:"–"}
@media (min-width: 1024px){
  .toc details{border:0;background:transparent}
  .toc summary{pointer-events:none;padding:0;min-height:0;margin-bottom:12px}
  .toc summary::after{content:none}
}
.toc ol{margin:0;padding:0 8px 12px;list-style:none;font-size:15px}
.toc ol ol{padding:0 0 4px 28px;font-size:14px}
@media (min-width: 1024px){.toc ol{padding:0}.toc ol ol{padding:0 0 4px 28px}}
.toc a{display:flex;gap:8px;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);transition:color .2s, background .2s}
.toc ol ol a{padding:4px 8px;color:var(--ink-2)}
.toc a:hover{background:var(--sand)}
.toc a .n{font-family:var(--mono);font-size:12px;color:var(--faint);padding-top:3px;flex:none;width:20px}
.toc a.is-current{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc a.is-dim{color:#A8A69E}
.toc .hint{margin:16px 8px 0;font-size:13px;color:var(--muted);line-height:1.5}

.section{padding-block:48px;border-top:1px solid var(--line);transition:opacity .3s}
.section.is-dim{opacity:.3}
.section.is-dim:hover,.section.is-dim:focus-within{opacity:.75}
.item{padding-top:32px;margin-top:32px;border-top:1px dashed var(--line);transition:opacity .3s}
.item.is-dim{opacity:.3}
.item.is-dim:hover,.item.is-dim:focus-within{opacity:.75}
.section.is-dim .item.is-dim{opacity:1}
.item h3{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:clamp(26px, 3vw, 32px);line-height:1.15}

/* Long-form item text */
.prose{max-width:720px;overflow-wrap:break-word}
.prose > :first-child{margin-top:0}
.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{font-family:var(--sans);line-height:1.3;margin:1.6em 0 .5em}
.prose h2{font-size:22px}.prose h3{font-size:20px}.prose h4{font-size:18px}.prose h5,.prose h6{font-size:16px}
.prose p{margin:0 0 1em}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.3em 0}
.prose li > ul,.prose li > ol{margin:.3em 0 0}
.prose a{overflow-wrap:anywhere}
.prose img,.prose video{max-width:100%;height:auto;border-radius:8px}
.prose iframe{display:block;width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:8px}
.prose figure{margin:1.5em 0}
.prose blockquote{margin:1.5em 0;padding:4px 0 4px 16px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.prose pre{margin:0 0 1em;padding:14px 16px;border-radius:8px;background:var(--sand);overflow-x:auto;font-size:14px}
.prose pre code{padding:0;background:none;overflow-wrap:normal}
.prose table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:0 0 1em;font-size:15px}
.prose th,.prose td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}

/* Punted */
.punted{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:28px;border-radius:var(--radius);border:2px dashed var(--line-2);margin-top:56px}
.punted svg{flex:none;transition:transform .6s ease}
.punted:hover svg{transform:rotate(-25deg) translate(6px,-6px)}
.punted h2{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1}
.punted .prose{font-size:15px;color:var(--ink-2)}
.punted .prose > :last-child{margin-bottom:0}
.changelog{padding-top:56px}
.changelog h2,.resources-wrap h2{margin:0 0 20px;font-family:var(--serif);font-weight:500;font-size:32px}
.resources-wrap{padding-top:56px}
.resources{display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr));gap:12px}
.resources a{display:block;padding:20px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .2s, transform .2s;overflow-wrap:anywhere}
.resources a:hover{border-color:var(--ink);transform:translateY(-2px)}
.resources b{display:block}
.resources span{font-size:14px;color:var(--muted)}

footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
footer .poetry{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink)}

.to-top{position:fixed;right:16px;bottom:16px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.to-top.show{opacity:1;pointer-events:auto}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media print{
  .site-header,.progress,.to-top,.aud,.toc{display:none}
  .section.is-dim,.item.is-dim{opacity:1}
  .layout{display:block}
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="progress" aria-hidden="true"><span id="progress"></span></div>

<!-- sot:header -->

<div id="top" class="wrap">
<!-- sot:hero -->
<!-- sot:stats -->
</div>

<!-- sot:timeline -->

<div class="wrap">
  <section class="card aud" aria-labelledby="aud-h">
    <div>
      <h2 id="aud-h">Who are you reading as?</h2>
      <p>Pick one or more. Everything else steps back. <b id="matchLabel" aria-live="polite"></b></p>
    </div>
<!-- sot:filter -->
  </section>

  <div class="layout">
    <nav class="toc" aria-label="Table of contents">
      <details id="tocDetails" open>
        <summary>ON THIS PAGE</summary>
<!-- sot:toc -->
        <p class="hint">Faded entries don't match your audience picks.</p>
      </details>
    </nav>

    <main id="content">
<!-- sot:sections -->
<!-- sot:punted -->
<!-- sot:changelog -->
<!-- sot:resources -->
    </main>
  </div>
</div>

<footer>
  <div class="wrap">
    <span class="poetry">Code is poetry.</span>
    <span>Source of Truth</span>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="Back to top"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<script src="site.js"></script>
</body>
</html>
